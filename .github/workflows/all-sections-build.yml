name: Prepare all-section frame pacing
on:
  push:
    branches: [perf/all-sections-frameskip-build]
permissions:
  contents: write
concurrency:
  group: all-sections-prepare
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'lisu188/tetris4d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/all-sections-frameskip-build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python .ci/apply-all-sections.py
      - name: Ensure display dependencies
        run: |
          if ! command -v xvfb-run || ! command -v xauth || ! python -c 'import tkinter'; then
            timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update || true
            timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 install -y xvfb xauth python3-tk
          fi
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tools/build_native.py
      - name: Validate render pacing and all section visibility
        run: |
          python tests/test_frame_pacing.py
          python -S tests/test_frame_pacing.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_eight_views.py > validation/all-sections-ci.json
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_frame_pacing_gui.py > validation/frame-pacing-gui-ci.json
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_hyperlayer_gui.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_benchmark_logging_gui.py
      - name: Verify engine and logged trajectories
        run: |
          python sparse_tetris_4d_optimized.py --test --backend native
          python tests/test_native.py --trajectory-pieces 2600
          python tests/test_benchmark_logging.py --trajectory-pieces 2600
          python tests/test_launch_defaults.py
      - name: Publish tested changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py tetris_benchmark_logging.py README.md docs/eight-views.md .github/workflows/eight-views.yml tests/test_eight_views.py tests/test_frame_pacing.py tests/test_frame_pacing_gui.py validation/all-sections-rendering.json validation/frame-pacing-local.json validation/all-sections-ci.json validation/frame-pacing-gui-ci.json
          git commit -m 'feat: show all sections with adaptive render-only frame skipping'
          git push origin HEAD:perf/all-sections-frameskip-build
