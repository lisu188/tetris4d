name: Build checkpoint support
on:
  push:
    branches: [train/shared-sigmoid-v1]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'lisu188/tetris4d'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: train/shared-sigmoid-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply verified source patch
        run: |
          test "$(git hash-object sparse_tetris_4d_optimized.py)" = 61e7dd923d3784a1f20cd4af9d58b10eb1dc322e
          git apply .ci/training-source.patch
          test "$(git hash-object sparse_tetris_4d_optimized.py)" = 1a1c9111aaba4a8f79b3c40e6b33a35925de1575
      - name: Validate engine
        run: |
          python -m pip install -r requirements-numpy.txt
          python sparse_tetris_4d_optimized.py --test --backend python
          python sparse_tetris_4d_optimized.py --test --backend numpy
      - name: Commit verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py
          git commit -m 'feat: support trained sigmoid checkpoints and cache invalidation'
          git push origin HEAD:train/shared-sigmoid-v1
