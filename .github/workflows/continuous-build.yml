name: Prepare continuous-play change
on:
  push:
    branches: [fix/continuous-build-20261111]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'lisu188/tetris4d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/continuous-build-20261111
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply checksum-verified change
        run: python .ci/apply-continuous.py
      - name: Validate continuation and explicit first-clear mode
        run: |
          python -m pip install -r requirements-numpy.txt
          python tests/test_continuous.py --backend python
          python -S tests/test_continuous.py --backend auto
          python tests/test_continuous.py --backend numpy --integration
          python sparse_tetris_4d_optimized.py --test --backend numpy
      - name: Publish tested source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py tests/test_hyperlayer_gui.py README.md docs/first-hyperlayer.md
          git commit -m 'fix: continue after hyperlayer clears and retarget compacted boards'
          git push origin HEAD:fix/continuous-build-20261111
