name: Hyperlayer planner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperlayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tests/test_hyperlayer.py --backend python
      - run: python tests/test_hyperlayer.py --backend numpy
      - run: python -S tests/test_hyperlayer.py --backend auto

  first-clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tools/first_hyperlayer.py --seed 7 --backend numpy --output first-clear.json
      - run: python tools/first_hyperlayer.py --verify first-clear.json
      - run: python -c "import json; r=json.load(open('first-clear.json', encoding='utf-8')); assert r['summary']['hyperlayers'] == 1 and r['summary']['pieces'] == 1251, r['summary']"

  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - run: python -m pip install -r requirements-numpy.txt
      - run: xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_hyperlayer_gui.py
