name: Optional neural policy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neural-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python tools/build_native.py
      - run: python tests/test_neural.py --output neural-correctness.json
      - run: python tetris_neural.py smoke --device cpu --output neural-smoke.json
      - run: bash .github/scripts/ensure-display.sh
      - run: xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_neural_gui.py
      - run: python -S sparse_tetris_4d_optimized.py --test --backend python
      - run: python tests/test_launch_defaults.py
      - run: python tests/test_sustained_policy.py
