name: Prepare tested unlimited playback
on:
  push:
    branches: [ui/unlimited-build-20261111]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'lisu188/tetris4d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ui/unlimited-build-20261111
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply source changes
        run: python .ci/apply-unlimited.py
      - name: Ensure display dependencies
        run: |
          if ! command -v xvfb-run || ! command -v xauth || ! python -c 'import tkinter'; then
            timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update || true
            timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 install -y xvfb xauth python3-tk
          fi
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tools/build_native.py
      - name: Check pacing, defaults and trajectories
        run: |
          python tests/test_unlimited_speed.py --trajectory-pieces 2600 > validation/unlimited-speed-ci.json
          python -S tests/test_unlimited_speed.py
          python tests/test_frame_pacing.py
          python tests/test_launch_defaults.py
          python sparse_tetris_4d_optimized.py --test --backend native
      - name: Check actual GUI behavior
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_unlimited_speed_gui.py > validation/unlimited-speed-gui-ci.json
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_frame_pacing_gui.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_eight_views.py
      - name: Publish validated source and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py README.md validation/unlimited-speed-ci.json validation/unlimited-speed-gui-ci.json
          git commit -m 'feat: replace speed slider with presets and uncapped playback'
          git push origin HEAD:ui/unlimited-build-20261111
