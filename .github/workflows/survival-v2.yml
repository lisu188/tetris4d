name: Audited survival v2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: survival-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt 'torch==2.10.0+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python tools/build_native.py
      - run: python tests/test_survival_v2.py
      - run: python tools/validate_survival_v2.py --backend native --output survival-v2-validation.json
      - run: python tests/test_survival_ppo.py
      - run: python train_survival_v2.py --help
      - run: python tools/survival_experiments.py compare --help
      - run: python tools/survival_experiments.py archive --help
