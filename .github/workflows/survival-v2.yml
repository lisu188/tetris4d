name: Audited survival v2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: survival-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt 'torch==2.10.0+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python tools/build_native.py
      - run: python tests/test_native_sustained_metrics.py
      - run: python tests/test_neural_preparation.py
      - run: python tests/test_survival_v2.py
      - run: python -B tests/test_ppo_bootstrap.py
      - run: python tests/test_reference_ppo.py
      - run: python tests/test_reference_ablation.py
      - run: python -B tests/test_survival_architecture.py
      - run: python -B tests/test_survival_v3.py
      - run: python -B tests/test_survival_v4.py
      - run: python -B tests/test_survival_v4_gpu.py
      - run: python -B tests/test_exhaustive_screening.py
      - run: python -B tests/test_v4_improvements.py
      - run: python -B -m unittest discover -s tests -p test_spatial_curriculum.py
      - run: python -B -m unittest discover -s tests -p test_spatial_ppo_benchmark.py
      - run: python -B tests/test_survival_v5.py
      - run: python -B tests/test_afterstate_td_model.py
      - run: python -B tests/test_evaluate_afterstate_td.py
      - run: python -B tests/test_game_library.py
      - run: python -B tests/test_survival_v3_migration.py
      - run: python tests/test_survival_longevity.py
      - run: python tests/test_rollout_cache.py
      - run: python -B -m unittest discover -s tests -p test_fixed_rollout.py
      - run: python -B -m unittest discover -s tests -p 'test_gpu*.py'
      - run: python tests/test_neuron_analysis.py
      - run: python -B -m unittest discover -s tests -p test_training_dashboard.py
      - run: python tools/validate_survival_v2.py --backend native --output survival-v2-validation.json
      - run: python tests/test_survival_ppo.py
      - run: python -B train_survival_v4.py --help
      - run: python tools/survival_experiments.py compare --help
      - run: python tools/survival_experiments.py archive --help
