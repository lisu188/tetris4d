name: Validate optional renderer telemetry
on:
  push:
    branches: [perf/renderer-metrics-build-20261111]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'lisu188/tetris4d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/renderer-metrics-build-20261111
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Handle telemetry without constructed renderer widgets
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('sparse_tetris_4d_optimized.py')
          b = p.read_bytes()
          assert hashlib.sha1(f'blob {len(b)}\0'.encode() + b).hexdigest() == '7e9926e7d6652cf2ae678ce79355a1de6e27a3f5'
          s = b.decode()
          old = "        result.update(atlas_scene_rebuilds=self.atlas.scene_rebuilds,\n                      atlas_cell_updates=self.atlas.cell_updates,\n                      atlas_cells_created=self.atlas.cells_created,\n                      ownership_appends=self.well.ownership_appends,\n                      ownership_full_scans=self.well.ownership_full_scans,"
          new = "        atlas = getattr(self, 'atlas', None)\n        result.update(atlas_scene_rebuilds=getattr(atlas, 'scene_rebuilds', 0),\n                      atlas_cell_updates=getattr(atlas, 'cell_updates', 0),\n                      atlas_cells_created=getattr(atlas, 'cells_created', 0),\n                      ownership_appends=getattr(self.well, 'ownership_appends', 0),\n                      ownership_full_scans=getattr(self.well, 'ownership_full_scans', 0),"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Check headless playback tests with no third-party dependency
        run: |
          python tests/test_unlimited_speed.py
          python -S tests/test_unlimited_speed.py
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tools/build_native.py
      - name: Full post-clear trajectory equivalence
        run: python tests/test_unlimited_speed.py --trajectory-pieces 2600
      - name: Ensure display dependencies
        run: |
          if ! command -v xvfb-run || ! command -v xauth || ! python -c 'import tkinter'; then
            timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update || true
            timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 install -y xvfb xauth python3-tk
          fi
      - name: Renderer and telemetry regression
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_renderer_optimization.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_eight_views.py
      - name: Publish validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py
          git commit -m 'fix: keep renderer telemetry compatible with headless playback'
          git push origin HEAD:perf/renderer-metrics-build-20261111
