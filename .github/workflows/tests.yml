name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional accelerator
        run: python -m pip install -r requirements-numpy.txt
      - name: Check syntax
        run: python -m py_compile sparse_tetris_4d_optimized.py tools/train_agent.py tools/evaluate_agent.py tests/test_training.py
      - name: Test standard-library backend
        run: python sparse_tetris_4d_optimized.py --test --backend python
      - name: Test NumPy backend
        run: python sparse_tetris_4d_optimized.py --test --backend numpy
      - name: Test compact network structure
        run: |
          python tests/test_network_structure.py --backend python
          python tests/test_network_structure.py --backend numpy
      - name: Test automatic fallback without site packages
        run: python -S sparse_tetris_4d_optimized.py --test --backend auto
      - name: Test checkpoint and training implementation
        run: |
          python tests/test_training.py --backend python
          python tests/test_training.py --backend numpy
      - name: Test trained checkpoint
        run: |
          python sparse_tetris_4d_optimized.py --test --backend python --weights models/trained-sigmoid.json
          python sparse_tetris_4d_optimized.py --test --backend numpy --weights models/trained-sigmoid.json
          python -S sparse_tetris_4d_optimized.py --test --backend auto --weights models/trained-sigmoid.json

  gui:
    name: Tkinter smoke test / virtual display
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install display tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - name: Install optional accelerator
        run: python -m pip install -r requirements-numpy.txt
      - name: Run graphical smoke test
        run: |
          xvfb-run -a -s '-screen 0 1560x960x24' python sparse_tetris_4d_optimized.py --gui-smoke --backend numpy > gui-smoke.json
          python -c "import json; r = json.load(open('gui-smoke.json', encoding='utf-8')); assert r['passed'] and r['selected_drop'] and r['visible_network_nodes'] > 0, r; print(r)"
      - name: Run trained graphical smoke test
        run: |
          xvfb-run -a -s '-screen 0 1560x960x24' python sparse_tetris_4d_optimized.py --gui-smoke --backend numpy --weights models/trained-sigmoid.json > trained-gui-smoke.json
          python -c "import json; r = json.load(open('trained-gui-smoke.json', encoding='utf-8')); assert r['passed'] and r['selected_drop'] and r['visible_network_nodes'] > 0, r; print(r)"
