name: Prepare optional GPU policy
on:
  push:
    branches: [neural/gpu-build-20261111]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: neural/gpu-build-20261111
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unpack checksum-verified implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, lzma
          payload = b''.join(Path(f'.ci/neural-part{i}').read_bytes() for i in range(5))
          assert hashlib.sha256(payload).hexdigest() == 'a26373fe2ce5b1fa6d253cf2ca64d3c1fc243f5591d52b047dd78d6114edec86'
          for name, text in json.loads(lzma.decompress(payload)).items():
              p = Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
          PY
          python .ci/integrate-neural.py
      - run: python -m pip install -r requirements-numpy.txt
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python tools/build_native.py
      - name: Verify learning and checkpoint correctness
        run: |
          python tests/test_neural.py --output validation/neural-correctness-ci.json
          python tetris_neural.py smoke --device cpu --output validation/neural-smoke-ci.json
          python tests/test_launch_defaults.py
          python tests/test_sustained_policy.py
          python -S sparse_tetris_4d_optimized.py --test --backend python
      - name: Verify actual Tk integration
        run: |
          bash .github/scripts/ensure-display.sh
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_neural_gui.py > validation/neural-gui-ci.json
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_unlimited_speed_gui.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_renderer_optimization.py
      - name: Publish tested application without transport files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py tetris_neural.py tests/test_neural.py tests/test_neural_gui.py requirements-neural.txt docs/neural-policy.md README.md .gitignore validation/neural-correctness-ci.json validation/neural-smoke-ci.json validation/neural-gui-ci.json
          git commit -m 'feat: implement optional sigmoid GPU policy, trainers and learned activations'
          git push origin HEAD:neural/gpu-build-20261111
