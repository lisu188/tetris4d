name: Import verified hyperlayer patch
on:
  push:
    branches: [merge/hyperlayer-import-20261111]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'lisu188/tetris4d'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: merge/hyperlayer-import-20261111
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply checksum-verified conversation patch
        shell: bash
        run: |
          test "$(git hash-object sparse_tetris_4d_optimized.py)" = 1a1c9111aaba4a8f79b3c40e6b33a35925de1575
          test "$(git hash-object README.md)" = f939732593f0d71e54b86e3955959ad6b6a030d3
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          encoded = ''.join(Path('.ci/hyperlayer-merge', name).read_text() for name in ('01', '02'))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a3e30576b44dddd3e9ed8d2ffdebece0373af5abb917f101204be2136980a990'
          subprocess.run(['git', 'apply', '--check', '--exclude=.github/workflows/hyperlayer.yml', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--exclude=.github/workflows/hyperlayer.yml', '-'], input=patch, check=True)
          PY
          test "$(git hash-object sparse_tetris_4d_optimized.py)" = 0a45c4103dd34be322577cc053468c53d4f44dbd
          git diff --check
      - name: Run regression tests
        run: |
          python -m pip install -r requirements-numpy.txt
          python sparse_tetris_4d_optimized.py --test --backend python
          python sparse_tetris_4d_optimized.py --test --backend numpy
          python tests/test_hyperlayer.py --backend python
          python tests/test_hyperlayer.py --backend numpy
          python tests/test_network_structure.py --backend numpy
          python tests/test_training.py --backend numpy
      - name: Verify first hyperlayer clear
        run: |
          python tools/first_hyperlayer.py --seed 7 --backend numpy --output first-clear.json
          python tools/first_hyperlayer.py --verify first-clear.json
          python -c "import json; r=json.load(open('first-clear.json', encoding='utf-8')); assert r['summary']['hyperlayers']==1 and r['summary']['pieces']==1251, r['summary']"
      - name: Commit verified source only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md sparse_tetris_4d_optimized.py docs/first-hyperlayer.md tests/test_hyperlayer.py tests/test_hyperlayer_gui.py tools/first_hyperlayer.py validation/hyperlayer-integration.json
          git commit -m 'feat: import verified first-hyperlayer implementation'
          git push origin HEAD:merge/hyperlayer-import-20261111
