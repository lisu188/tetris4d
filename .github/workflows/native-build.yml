name: Prepare verified native scorer
on:
  push:
    branches: [perf/native-build-20261111]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'lisu188/tetris4d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/native-build-20261111
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Import checksum-verified implementation
        shell: bash
        run: |
          test "$(git hash-object sparse_tetris_4d_optimized.py)" = 7e20001949c2497eacc4ae88a7615ba61aa95983
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          raw = base64.b64decode(''.join(p.read_text().strip() for p in sorted(Path('.ci/native').iterdir())), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '20777bfa3a03cc596199a3fec1b133a0b1f62f06de9381a4ce01f5699665a4e7'
          files = json.loads(lzma.decompress(raw))
          allowed = {'native-source.patch', 'native/tetris_native.c', 'tools/build_native.py', 'tools/benchmark_native.py', 'tests/test_native.py', 'docs/native-backend.md', 'validation/native-backend.json'}
          assert set(files) == allowed
          for name, content in files.items():
              path = Path('.ci/native-source.patch') if name == 'native-source.patch' else Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          p = Path('README.md')
          p.write_text(p.read_text(encoding='utf-8') + '\n\n## Native scorer for WSL/Linux\n\nAn optional strict-float C backend fuses candidate scoring and target rejection, with runtime-gated AVX2 landing and BMI2 compaction. Build with `python tools/build_native.py`; normal no-argument launch then selects it automatically. NumPy and Python remain fallbacks. See [build commands, WSL diagnostics, validation and measured performance](docs/native-backend.md).\n\nRun `python tests/test_native.py --trajectory-pieces 2600` and `python tools/benchmark_native.py --output native-benchmark.json` to validate and measure on your machine.\n', encoding='utf-8')
          p = Path('.gitignore')
          p.write_text(p.read_text(encoding='utf-8') + '\n/native/*.so\n/native/*.dylib\n/native/*.so.json\n/native/*.dylib.json\n.venv/\n', encoding='utf-8')
          PY
          git apply --check .ci/native-source.patch
          git apply .ci/native-source.patch
          test "$(git hash-object sparse_tetris_4d_optimized.py)" = 683d87c038777e0effae438b8ae5489b453ee727
      - name: Compile and validate exact native gameplay
        run: |
          python -m pip install -r requirements-numpy.txt
          python tools/build_native.py --cc gcc
          python tests/test_native.py --trajectory-pieces 2600
          python sparse_tetris_4d_optimized.py --test --backend native
          python tests/test_launch_defaults.py
      - name: Publish tested source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py native/tetris_native.c tools/build_native.py tools/benchmark_native.py tests/test_native.py docs/native-backend.md validation/native-backend.json README.md .gitignore
          git commit -m 'perf: add strict native scorer with CPU-dispatched AVX2 and BMI2 paths'
          git push origin HEAD:perf/native-build-20261111
