name: Benchmark logging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-logging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tests/test_benchmark_logging.py
      - run: python -S tests/test_benchmark_logging.py

  native-and-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tools/build_native.py
      - run: python tests/test_benchmark_logging.py --trajectory-pieces 2600
      - run: python tools/benchmark_logging.py --pieces 300 --repetitions 3 --output logging-overhead.json
      - name: GUI telemetry and argument-free launch
        run: |
          bash .github/scripts/ensure-display.sh
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_benchmark_logging_gui.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python sparse_tetris_4d_optimized.py --gui-smoke
