name: Stage benchmark logging
on:
  push:
    branches: [perf/benchmark-logging-build-20261111]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'lisu188/tetris4d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/benchmark-logging-build-20261111
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python .ci/apply-benchmark-logging.py
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tools/build_native.py
      - run: python tests/test_benchmark_logging.py --trajectory-pieces 2600
      - run: python -S tests/test_benchmark_logging.py
      - run: python tools/benchmark_logging.py --pieces 300 --repetitions 3 --output logging-overhead.json
      - name: GUI logging
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_benchmark_logging_gui.py
      - name: Publish verified integration only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py README.md .gitignore
          git commit -m 'feat: enable local benchmark telemetry for argument-free play'
          git push origin HEAD:perf/benchmark-logging-build-20261111
