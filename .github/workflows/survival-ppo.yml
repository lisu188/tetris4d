name: Survival PPO training
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: survival-ppo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python tools/build_native.py
      - run: python tests/test_survival_ppo.py
      - run: python tests/test_overnight.py
      - run: python tests/test_neural.py
      - run: python train_survival.py --help
      - name: Existing learned-activation GUI remains functional
        run: |
          bash .github/scripts/ensure-display.sh
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_neural_gui.py
