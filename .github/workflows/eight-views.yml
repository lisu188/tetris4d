name: Eight simultaneous views

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eight-views-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, native]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - run: python -m pip install -r requirements-numpy.txt
      - if: matrix.backend == 'native'
        run: python tools/build_native.py
      - name: Verify eight visible sections and current telemetry
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_eight_views.py
      - name: Verify previous GUI and default behavior
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_hyperlayer_gui.py
          python tests/test_launch_defaults.py
