name: All sections and frame pacing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-sections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tests/test_frame_pacing.py
      - run: python -S tests/test_frame_pacing.py

  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, native]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Ensure display dependencies
        run: |
          if ! command -v xvfb-run || ! command -v xauth || ! python -c 'import tkinter'; then
            timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update || true
            timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 install -y xvfb xauth python3-tk
          fi
      - run: python -m pip install -r requirements-numpy.txt
      - if: matrix.backend == 'native'
        run: python tools/build_native.py
      - run: xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_eight_views.py
      - run: xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_frame_pacing_gui.py
      - run: xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_hyperlayer_gui.py
      - run: python tests/test_launch_defaults.py
