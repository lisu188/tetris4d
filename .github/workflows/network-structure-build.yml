name: Build compact network change
on:
  push:
    branches: [optimize/shared-sigmoid-structure]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'lisu188/tetris4d'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: optimize/shared-sigmoid-structure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply verified source patch
        shell: bash
        run: |
          test "$(git hash-object sparse_tetris_4d_optimized.py)" = 8098bdc5ff15565b7ef7d01db4ac9549bee30b97
          python -c "from pathlib import Path; import sys; s=Path('.ci/network-structure.patch').read_text(); sys.stdout.write(s.replace('range(*index.indices(len(self))))]', 'range(*index.indices(len(self)))]'))" | git apply
          test "$(git hash-object sparse_tetris_4d_optimized.py)" = 61e7dd923d3784a1f20cd4af9d58b10eb1dc322e
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          p.write_text(p.read_text() + '\n## Compact shared-sigmoid network\n\nThe evaluator now uses two shared sigmoid filters, exact histogram pooling and lazy activation traces. Logical neurons and gameplay are unchanged. See [network structure and measurements](docs/network-structure.md).\n\n`--network` exports the compact structure; `--network-expanded` reconstructs every logical neuron and connection.\n')
          PY
      - name: Validate both engines and network regression tests
        run: |
          python -m pip install -r requirements-numpy.txt
          python sparse_tetris_4d_optimized.py --test --backend python
          python sparse_tetris_4d_optimized.py --test --backend numpy
          python -S sparse_tetris_4d_optimized.py --test --backend auto
          python tests/test_network_structure.py --backend python
          python tests/test_network_structure.py --backend numpy
      - name: Commit only the verified source result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py README.md
          git commit -m 'perf: compile shared sigmoid network with exact pooled inference'
          git push origin HEAD:optimize/shared-sigmoid-structure
