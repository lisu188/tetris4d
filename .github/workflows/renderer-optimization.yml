name: Retained renderer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retained-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Ensure display dependencies
        run: |
          if ! command -v xvfb-run || ! command -v xauth || ! python -c 'import tkinter'; then
            timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update || true
            timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 install -y xvfb xauth python3-tk
          fi
      - run: python -m pip install -r requirements-numpy.txt
      - if: matrix.backend == 'native'
        run: python tools/build_native.py
      - name: Rendering equivalence and bounded retained state
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_renderer_optimization.py
      - name: Reproducible benchmark smoke test
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python tools/benchmark_rendering.py --start 24 --frames 8 --repetitions 1 --output renderer-smoke.json
