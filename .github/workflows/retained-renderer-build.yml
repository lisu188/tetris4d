name: Validate retained renderer build
on:
  push:
    branches: [perf/retained-render-build-20261111]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'lisu188/tetris4d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/retained-render-build-20261111
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python .ci/apply-retained-renderer.py
      - name: Ensure display dependencies
        run: |
          if ! command -v xvfb-run || ! command -v xauth || ! python -c 'import tkinter'; then
            timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update || true
            timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 install -y xvfb xauth python3-tk
          fi
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tools/build_native.py
      - name: Exact rendering and incremental-state regression
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_renderer_optimization.py
      - name: Existing all-section and simulation tests
        run: |
          python sparse_tetris_4d_optimized.py --test --backend native
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_eight_views.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_frame_pacing_gui.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_unlimited_speed_gui.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python tests/test_hyperlayer_gui.py
      - name: Matched-work rendering benchmark
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python tools/benchmark_rendering.py --output validation/rendering-performance.json
      - name: Publish validated source and measurements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sparse_tetris_4d_optimized.py validation/rendering-performance.json
          git commit -m 'perf: retain atlas cells, append ownership and batch static mesh drawing'
          git push origin HEAD:perf/retained-render-build-20261111
