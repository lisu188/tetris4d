name: Native scorer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tools/build_native.py --cc ${{ matrix.compiler }}
      - run: python tests/test_native.py --trajectory-pieces 2600
      - run: python sparse_tetris_4d_optimized.py --test --backend native
      - run: python sparse_tetris_4d_optimized.py --test --backend native --baseline
      - run: python tests/test_launch_defaults.py
      - run: python -S sparse_tetris_4d_optimized.py --test --backend auto
      - name: Native GUI smoke test
        run: |
          bash .github/scripts/ensure-display.sh
          xvfb-run -a python sparse_tetris_4d_optimized.py --gui-smoke --backend native > native-gui.json
          python -c "import json; r=json.load(open('native-gui.json')); assert r['passed'] and r['selected_drop'] and r['visible_network_nodes'] > 0, r"
  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-numpy.txt
      - run: python tools/build_native.py --cc gcc --sanitize
      - run: python tests/test_native.py
